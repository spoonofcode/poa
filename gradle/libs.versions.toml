[versions]
# --- Project Configuration ---
android-compileSdk = "37"
android-minSdk = "30"
android-targetSdk = "37"
project-applicationId = "com.spoonofcode.poa"
project-versionCode = "1"
project-versionName = "1.0"

# --- Build Tools ---
agp = "9.2.1"
kotlin = "2.4.10"
google-services = "4.5.0"
desugar-jdk-libs = "2.1.5"

# --- UI & Compose Multiplatform ---
# NOT UPGRADE - NAVIGATION PROBLEM ON IOS
compose-multiplatform = "1.10.3"
compose-icons = "1.1.1"
# NOT UPGRADE - NAVIGATION PROBLEM ON IOS
compottie = "2.1.0"
# NOT UPGRADE - NAVIGATION PROBLEM ON IOS
landscapist-coil = "2.9.7"

# --- AndroidX ---
androidx-activity-compose = "1.13.0"
androidx-credentials = "1.6.0"
androidx-security = "1.1.0"
androidx-splash = "1.2.0"
# NOT UPGRADE - NAVIGATION PROBLEM ON IOS
androidx-lifecycle = "2.10.0"

# --- Navigation ---
navigation-compose = "2.9.2"
navigation3 = "1.2.0-alpha07"
navigation3-jetbrains = "1.2.0-alpha02"

# --- Google & Firebase ---
firebase-bom = "34.17.0"
google-id = "1.2.0"
recaptcha = "18.9.2"

# --- Networking (Ktor) ---
ktor = "3.5.1"

# --- Dependency Injection (Koin) ---
koin = "4.2.2"

# --- KotlinX & Utils ---
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
kotlinx-serialization = "1.11.0"
connectivity = "2.5.0"
kermit = "2.1.0"
ksafe = "3.0.0"
# NOT UPGRADE - NAVIGATION PROBLEM ON IOS
calf-permissions = "0.11.0"

# --- Testing & Tooling ---
buildkonfig = "0.22.0"
kover = "0.9.9"
mokkery = "3.4.2"
turbine = "1.2.1"
# NOT UPGRADE - NAVIGATION PROBLEM ON IOS
media3 = "1.10.1"

[libraries]
# --- Plugins as Dependencies ---
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
jetbrains-compose = { group = "org.jetbrains.compose", name = "compose-gradle-plugin", version.ref = "compose-multiplatform" }
compose-gradle-plugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
buildkonfig-gradle-plugin = { group = "com.codingfeline.buildkonfig", name = "buildkonfig-gradle-plugin", version.ref = "buildkonfig" }

# --- AndroidX Core ---
android-desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar-jdk-libs" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidx-credentials" }
androidx-credentials-play-service-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidx-credentials" }
androidx-security = { module = "androidx.security:security-crypto", version.ref = "androidx-security" }
androidx-splash-screen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-splash" }

# --- Lifecycle ---
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }

# --- UI Libraries ---
calf-permissions = { module = "com.mohamedrejeb.calf:calf-permissions", version.ref = "calf-permissions" }
compottie = { module = "io.github.alexzhirkevich:compottie", version.ref = "compottie" }
compose-icons-fontawesome = { group = "br.com.devsrsouza.compose.icons", name = "font-awesome", version.ref = "compose-icons" }
ksafe = { module = "eu.anifantakis:ksafe", version.ref = "ksafe" }
landscapist-coil = { module = "com.github.skydoves:landscapist-coil3", version.ref = "landscapist-coil" }

# --- Media ---
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }

# --- Navigation ---
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3-jetbrains" }

# --- Firebase & Google ---
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
google-id = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "google-id" }
recaptcha = { module = "com.google.android.recaptcha:recaptcha", version.ref = "recaptcha" }

# --- Koin ---
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

# --- Ktor ---
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-ios = { module = "io.ktor:ktor-client-ios", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# --- KotlinX ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# --- Logging & Connectivity ---
connectivity-core = { module = "dev.jordond.connectivity:connectivity-core", version.ref = "connectivity" }
connectivity-device = { module = "dev.jordond.connectivity:connectivity-device", version.ref = "connectivity" }
touchlab-kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }

# --- Testing & Tooling ---
buildkonfig-compiler = { group = "com.codingfeline.buildkonfig", name = "buildkonfig-compiler", version.ref = "buildkonfig" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
mokkery-runtime = { module = "dev.mokkery:mokkery-runtime", version.ref = "mokkery" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[bundles]
connectivity = ["connectivity-core", "connectivity-device"]
ktor = [
    "ktor-client-core",
    "ktor-client-auth",
    "ktor-client-logging",
    "ktor-client-content-negotiation",
    "ktor-serialization-kotlinx-json"
]
lifecycle = ["lifecycle-runtime-compose", "lifecycle-viewmodel", "lifecycle-viewmodel-compose"]
navigation = ["navigation-compose", "navigation3-runtime", "navigation3-ui"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
buildkonfig = { id = "com.codingfeline.buildkonfig", version.ref = "buildkonfig" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
kotlin-cocoapods = { id = "org.jetbrains.kotlin.native.cocoapods", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
mokkery = { id = "dev.mokkery", version.ref = "mokkery" }

# Convention Plugins
convention-buildkonfig = { id = "com.spoonofcode.convention.buildkonfig", version = "unspecified" }
convention-cmp-application = { id = "com.spoonofcode.convention.cmp.application", version = "unspecified" }
convention-cmp-presentation = { id = "com.spoonofcode.convention.cmp.presentation", version = "unspecified" }
convention-kmp-data = { id = "com.spoonofcode.convention.kmp.data", version = "unspecified" }
convention-kmp-domain = { id = "com.spoonofcode.convention.kmp.domain", version = "unspecified" }
convention-kmp-library = { id = "com.spoonofcode.convention.kmp.library", version = "unspecified" }
convention-kmp-serialization = { id = "com.spoonofcode.convention.kmp.serialization", version = "unspecified" }