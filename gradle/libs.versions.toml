[versions]
# --- Android SDK ---
androidCompileSdk = "37"
androidMinSdk = "30"
androidTargetSdk = "37"

# NOT UPGRADE - NAVIGATION PROBLEM ON IOS
calfPermissions = "0.11.0"
ksafe = "3.0.0"
ksafeCompose = "3.0.0"
projectApplicationId = "com.spoonofcode.poa"
projectVersionName = "1.0"
projectVersionCode = "1"

# --- Android build tools / Gradle ---
agp = "9.2.1"
androidTools = "32.3.1"
desugarJdkLibs = "2.1.5"
googleServices = "4.5.0"

# --- Kotlin / KMP / Compose ---
kotlin = "2.4.10"
# NOT UPGRADE - NAVIGATION PROBLEM ON IOS
composeMultiplatform = "1.10.3"

# --- AndroidX ---
androidxActivityCompose = "1.13.0"
androidxCredentials = "1.6.0"
androidxSecurity = "1.1.0"
androidxSplash = "1.2.0"

# NOT UPGRADE - NAVIGATION PROBLEM ON IOS
lifecycleViewModelCompose = "2.10.0"

# --- Compose UI extras ---
composeBom = "2026.06.01"
material3 = "1.9.0"
materialIconsCore = "1.7.3"
composeIcons = "1.1.1"

# NOT UPGRADE - NAVIGATION PROBLEM ON IOS
landscapistCoil = "2.9.7"
media3 = "1.10.1"

# NOT UPGRADE - NAVIGATION PROBLEM ON IOS
compottie = "2.1.0"

navigation-compose = "2.9.2"
navigation3 = "1.2.0-alpha07"
navigation3-jetbrains = "1.2.0-alpha02"

# --- Google / Firebase ---
firebaseBom = "34.17.0"
googleId = "1.2.0"
recaptcha = "18.9.2"

# --- Networking / DI / Utils ---
ktor = "3.5.1"
koin = "4.2.2"
kermit = "2.1.0"
connectivity = "2.5.0"

# --- KotlinX ---
kotlinxDatetime = "0.8.0"
kotlinxSerializationJson = "1.11.0"
kotlinxCoroutines = "1.11.0"
kotlinxCoroutinesTest = "1.11.0"

# --- Testing ---
turbine = "1.2.1"

# --- Tooling / Codegen ---
ksp = "2.3.6"
buildkonfig = "0.22.0"
kover = "0.9.9"
mokkery = "3.4.2"

[libraries]
# --- Gradle plugins as deps (only if you use them from build-logic / convention plugins) ---
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
android-tools-common = { group = "com.android.tools", name = "common", version.ref = "androidTools" }
calf-permissions = { module = "com.mohamedrejeb.calf:calf-permissions", version.ref = "calfPermissions" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradle-plugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksafe-compose = { module = "eu.anifantakis:ksafe-compose", version.ref = "ksafeCompose" }
ksafe = { module = "eu.anifantakis:ksafe", version.ref = "ksafe" }
ksp-gradle-plugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
buildkonfig-gradle-plugin = { group = "com.codingfeline.buildkonfig", name = "buildkonfig-gradle-plugin", version.ref = "buildkonfig" }
buildkonfig-compiler = { group = "com.codingfeline.buildkonfig", name = "buildkonfig-compiler", version.ref = "buildkonfig" }

# --- Android core / desugaring ---
android-desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

# --- AndroidX ---
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidxCredentials" }
androidx-credentials-play-service-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidxCredentials" }
androidx-security = { module = "androidx.security:security-crypto", version.ref = "androidxSecurity" }
androidx-splash-screen = { module = "androidx.core:core-splashscreen", version.ref = "androidxSplash" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleViewModelCompose" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleViewModelCompose" }

# --- Compose Multiplatform ---
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }

jetbrains-compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version = "1.11.4" }
jetbrains-compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
jetbrains-compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
jetbrains-compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
jetbrains-compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
jetbrains-compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }

# --- Compose Material / Icons ---
jetbrains-compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
jetbrains-compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "materialIconsCore" }
jetbrains-compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "materialIconsCore" }
compose-icons-fontawesome = { group = "br.com.devsrsouza.compose.icons", name = "font-awesome", version.ref = "composeIcons" }

# --- Media / Images / Animations ---
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }
landscapist-coil = { module = "com.github.skydoves:landscapist-coil3", version.ref = "landscapistCoil" }
compottie = { module = "io.github.alexzhirkevich:compottie", version.ref = "compottie" }
compottie-dot = { module = "io.github.alexzhirkevich:compottie-dot", version.ref = "compottie" }
compottie-network = { module = "io.github.alexzhirkevich:compottie-network", version.ref = "compottie" }

# --- Google / Firebase ---
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" } # version from BoM
google-id = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleId" }
recaptcha = { module = "com.google.android.recaptcha:recaptcha", version.ref = "recaptcha" }

# --- DI / Settings / Logging / Network ---
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

touchlab-kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }

connectivity-core = { module = "dev.jordond.connectivity:connectivity-core", version.ref = "connectivity" }
connectivity-device = { module = "dev.jordond.connectivity:connectivity-device", version.ref = "connectivity" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-ios = { module = "io.ktor:ktor-client-ios", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# --- Kotlin / KotlinX ---
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }

navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3-jetbrains" }

# --- Testing (AndroidX + misc) ---
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

mokkery-runtime = { module = "dev.mokkery:mokkery-runtime", version.ref = "mokkery" }

[plugins]
# --- Android / Kotlin ---
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
