name: Android CI build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  get_version:
    outputs:
      ANDROID_RELEASE_VERSION: ${{ steps.version.outputs.ANDROID_RELEASE_VERSION }}
    runs-on: ubuntu-latest
    steps:
      - id: version
        run: |
          echo "ANDROID_RELEASE_VERSION=$(($GITHUB_RUN_NUMBER))" >> $GITHUB_OUTPUT
      - name: Print Android Package release version
        run: |
          echo "Got version: ${{ steps.version.outputs.ANDROID_RELEASE_VERSION }} "

  build:
    runs-on: ubuntu-latest
    needs: get_version
    env:
      ANDROID_RELEASE_VERSION: ${{ needs.get_version.outputs.ANDROID_RELEASE_VERSION }}

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4 # Action to check out your repository code
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew # Ensure the Gradle wrapper is executable

    - name: Decode Google Services JSON
      run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > composeApp/google-services.json

    - name: Decode Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks

    # - name: Create APK Release
    #   env:
    #     KEYSTORE_PATH: ${{ github.workspace }}/release.jks
    #     KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    #     KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    #     KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    #   run: ./gradlew assembleRelease

    - name: Create AAB Release ( for Google Play Console )
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/release.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew bundleRelease
      
    # - name: Upload APK Build Artifact
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: PoW-TagWriter-v${{ env.ANDROID_RELEASE_VERSION }}
    #     path: ./build/outputs/apk/release/

    - name: Upload AAB Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TaggyGo-v${{ env.ANDROID_RELEASE_VERSION }}
        path: ./composeApp/build/outputs/bundle/release/
