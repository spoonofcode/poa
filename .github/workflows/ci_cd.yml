name: CI/CD Pipeline

on:
  pull_request:
    branches: [ "develop", "release/**", "main" ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ "develop", "release/**", "main" ]
    tags: [ "v*.*.*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Formatting & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "GOOGLE_ID_SERVER_CLIENT_ID_WEB=${{ secrets.GOOGLE_ID_SERVER_CLIENT_ID_WEB }}" >> local.properties

      - name: Run Ktlint Check
        run: ./gradlew --no-build-cache ktlintCheck

  test:
    name: Unit Tests & Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "GOOGLE_ID_SERVER_CLIENT_ID_WEB=${{ secrets.GOOGLE_ID_SERVER_CLIENT_ID_WEB }}" >> local.properties

      - name: Decode Firebase Configuration Secrets
        run: |
          mkdir -p composeApp/src/development composeApp/src/production
          mkdir -p iosApp/Firebase/Development iosApp/Firebase/Production

          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_DEV_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_DEV_BASE64 }}" | base64 --decode > composeApp/src/development/google-services.json
          fi
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_PROD_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_PROD_BASE64 }}" | base64 --decode > composeApp/src/production/google-services.json
          fi
          if [ -n "${{ secrets.GOOGLE_SERVICES_INFO_DEV_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_INFO_DEV_BASE64 }}" | base64 --decode > iosApp/Firebase/Development/GoogleService-Info.plist
          fi
          if [ -n "${{ secrets.GOOGLE_SERVICES_INFO_PROD_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_INFO_PROD_BASE64 }}" | base64 --decode > iosApp/Firebase/Production/GoogleService-Info.plist
          fi

      - name: Run Unit Tests & Generate Kover Coverage Report
        run: ./gradlew testDevelopmentDebugUnitTest koverHtmlReport --parallel --continue

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'

      - name: Upload Kover Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-coverage-reports
          path: '**/build/reports/kover/'

  verify_android_build:
    name: Verification Build - Android (PR Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "GOOGLE_ID_SERVER_CLIENT_ID_WEB=${{ secrets.GOOGLE_ID_SERVER_CLIENT_ID_WEB }}" >> local.properties

      - name: Decode Firebase Configuration Secrets
        run: |
          mkdir -p composeApp/src/development
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_DEV_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_DEV_BASE64 }}" | base64 --decode > composeApp/src/development/google-services.json
          fi

      - name: Build Debug APK
        env:
          ANDROID_RELEASE_VERSION: ${{ github.run_number }}
        run: ./gradlew :composeApp:assembleDevelopmentDebug

      - name: Upload Verification APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaggyGo-VerificationDebug-v${{ github.run_number }}
          path: composeApp/build/outputs/apk/development/debug/*.apk

  verify_ios_build:
    name: Verification Build - iOS (PR Check)
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "GOOGLE_ID_SERVER_CLIENT_ID_WEB=${{ secrets.GOOGLE_ID_SERVER_CLIENT_ID_WEB }}" >> local.properties

      - name: Decode Firebase Configuration Secrets
        run: |
          mkdir -p iosApp/Firebase/Development
          if [ -n "${{ secrets.GOOGLE_SERVICES_INFO_DEV_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_INFO_DEV_BASE64 }}" | base64 --decode > iosApp/Firebase/Development/GoogleService-Info.plist
          fi

      - name: Generate Kotlin Framework & Podspec
        run: ./gradlew podspec generateDummyFramework

      - name: Install CocoaPods
        run: |
          cd iosApp
          pod install

      - name: Build iOS App (Simulator)
        run: |
          cd iosApp
          xcodebuild -workspace iosApp.xcworkspace \
                     -scheme "iosApp Dev" \
                     -configuration Debug-Development \
                     -sdk iphonesimulator \
                     -destination 'generic/platform=iOS Simulator' \
                     clean build

  auto_tag_release:
    name: Auto Tag Release on Main
    runs-on: ubuntu-latest
    needs: [lint, test, verify_android_build, verify_ios_build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag_created: ${{ steps.create_tag.outputs.tag_created }}
      release_tag: ${{ steps.create_tag.outputs.release_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto Create Git Tag from Release Branch PR
        id: create_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_BRANCH=$(gh pr list --state merged --limit 1 --json headRefName --jq '.[0].headRefName')
          echo "Merged PR branch: $PR_BRANCH"

          if [[ "$PR_BRANCH" =~ ^release/v?([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            TAG_NAME="v${VERSION}"
            echo "Extracted release tag: $TAG_NAME"

            if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
              echo "Tag $TAG_NAME already exists."
              echo "tag_created=false" >> $GITHUB_OUTPUT
              echo "release_tag=$TAG_NAME" >> $GITHUB_OUTPUT
            else
              echo "Creating and pushing tag $TAG_NAME..."
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
              git push origin "$TAG_NAME"
              echo "tag_created=true" >> $GITHUB_OUTPUT
              echo "release_tag=$TAG_NAME" >> $GITHUB_OUTPUT
            fi
          else
            echo "Branch $PR_BRANCH is not a release branch. Skipping auto-tagging."
            echo "tag_created=false" >> $GITHUB_OUTPUT
          fi

  production_android_release:
    name: Signed Production Build - Android
    runs-on: ubuntu-latest
    needs: [lint, test, verify_android_build, auto_tag_release]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.verify_android_build.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || needs.auto_tag_release.outputs.tag_created == 'true')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "GOOGLE_ID_SERVER_CLIENT_ID_WEB=${{ secrets.GOOGLE_ID_SERVER_CLIENT_ID_WEB }}" >> local.properties

      - name: Decode Firebase Configuration Secrets
        run: |
          mkdir -p composeApp/src/production
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_PROD_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_PROD_BASE64 }}" | base64 --decode > composeApp/src/production/google-services.json
          fi

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      - name: Build Signed Production Release Bundle
        env:
          ANDROID_RELEASE_VERSION: ${{ github.ref_name != 'main' && github.ref_name || needs.auto_tag_release.outputs.release_tag }}
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :composeApp:bundleProductionRelease

      - name: Upload Production AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TaggyGo-Android-Release-${{ github.ref_name != 'main' && github.ref_name || needs.auto_tag_release.outputs.release_tag }}
          path: composeApp/build/outputs/bundle/productionRelease/*.aab

  production_ios_release:
    name: Signed Production Build - iOS
    runs-on: macos-15
    needs: [lint, test, verify_ios_build, auto_tag_release]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.verify_ios_build.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || needs.auto_tag_release.outputs.tag_created == 'true')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "GOOGLE_ID_SERVER_CLIENT_ID_WEB=${{ secrets.GOOGLE_ID_SERVER_CLIENT_ID_WEB }}" >> local.properties

      - name: Decode Firebase Configuration Secrets
        run: |
          mkdir -p iosApp/Firebase/Production
          if [ -n "${{ secrets.GOOGLE_SERVICES_INFO_PROD_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_INFO_PROD_BASE64 }}" | base64 --decode > iosApp/Firebase/Production/GoogleService-Info.plist
          fi

      - name: Generate Kotlin Framework & Podspec
        run: ./gradlew podspec generateDummyFramework

      - name: Install CocoaPods
        run: |
          cd iosApp
          pod install

      - name: Build Production iOS App
        run: |
          cd iosApp
          xcodebuild -workspace iosApp.xcworkspace \
                     -scheme "iosApp Prod" \
                     -configuration Release-Production \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build
