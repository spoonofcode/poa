name: CI/CD Pipeline

# ==============================================================================
# NOTE: iOS builds, archiving, and App Store Connect uploads are currently 
# performed locally from Xcode on the developer's Mac (using Xcode 27 / macOS 27).
# All iOS CI/CD jobs have been fully commented out below and can be re-enabled 
# here in the cloud or via a self-hosted runner in the future once cloud runners support matching SDK versions.
# ==============================================================================

on:
  pull_request:
    branches: [ "develop", "release/**", "main" ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ "develop", "release/**", "main" ]
    tags: [ "v*.*.*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Formatting & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "GOOGLE_ID_SERVER_CLIENT_ID_WEB=${{ secrets.GOOGLE_ID_SERVER_CLIENT_ID_WEB }}" >> local.properties

      - name: Run Ktlint Check
        run: ./gradlew --no-build-cache ktlintCheck

  test:
    name: Unit Tests & Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "GOOGLE_ID_SERVER_CLIENT_ID_WEB=${{ secrets.GOOGLE_ID_SERVER_CLIENT_ID_WEB }}" >> local.properties

      - name: Decode Firebase Configuration Secrets
        run: |
          mkdir -p composeApp/src/development composeApp/src/production
          mkdir -p iosApp/Firebase/Development iosApp/Firebase/Production

          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_DEV_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_DEV_BASE64 }}" | base64 --decode > composeApp/src/development/google-services.json
          fi
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_PROD_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_PROD_BASE64 }}" | base64 --decode > composeApp/src/production/google-services.json
          fi
          if [ -n "${{ secrets.GOOGLE_SERVICES_INFO_DEV_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_INFO_DEV_BASE64 }}" | base64 --decode > iosApp/Firebase/Development/GoogleService-Info.plist
          fi
          if [ -n "${{ secrets.GOOGLE_SERVICES_INFO_PROD_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_INFO_PROD_BASE64 }}" | base64 --decode > iosApp/Firebase/Production/GoogleService-Info.plist
          fi

      - name: Run Unit Tests & Generate Kover Coverage Report
        run: ./gradlew testDevelopmentDebugUnitTest koverHtmlReport --parallel --continue

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'

      - name: Upload Kover Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-coverage-reports
          path: '**/build/reports/kover/'

  verify_android_build:
    name: Verification Build - Android (PR Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "GOOGLE_ID_SERVER_CLIENT_ID_WEB=${{ secrets.GOOGLE_ID_SERVER_CLIENT_ID_WEB }}" >> local.properties

      - name: Decode Firebase Configuration Secrets
        run: |
          mkdir -p composeApp/src/development
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_DEV_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_DEV_BASE64 }}" | base64 --decode > composeApp/src/development/google-services.json
          fi

      - name: Build Debug APK
        env:
          ANDROID_RELEASE_VERSION: ${{ github.run_number }}
        run: ./gradlew :composeApp:assembleDevelopmentDebug

      - name: Upload Verification APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaggyGo-VerificationDebug-v${{ github.run_number }}
          path: composeApp/build/outputs/apk/development/debug/*.apk

